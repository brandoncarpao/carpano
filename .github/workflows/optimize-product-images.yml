name: Optimize Carpaño product images

on:
  push:
    branches: [main]
    paths:
      - "assets/js/**.png"
      - "scripts/optimize-product-images.mjs"
      - ".github/workflows/optimize-product-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimize-carpano-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install image processor
        run: npm install --no-save --package-lock=false sharp@0.34.3

      - name: Convert, optimize and standardize product photos
        run: node scripts/optimize-product-images.mjs

      - name: Commit optimized images and updated references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/js/ index.html productos/*.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Optimize product images to 4:5 WebP"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
          fi
