name: Optimize and prepare Carpaño product images

on:
  push:
    branches: [main]
    paths:
      - "assets/js/**.jpg"
      - "assets/js/**.jpeg"
      - "scripts/optimize-product-images.mjs"
      - "scripts/remove-product-backgrounds.py"
      - ".github/workflows/optimize-product-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-carpano-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processors
        run: |
          npm install --no-save sharp
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]" pillow

      - name: Convert and optimize source photos
        run: node scripts/optimize-product-images.mjs

      - name: Remove backgrounds and standardize composition
        run: python scripts/remove-product-backgrounds.py

      - name: Commit prepared images and updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/*.webp index.html productos/*.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Remove product photo backgrounds and refine composition"
            git push origin HEAD:main
          fi
